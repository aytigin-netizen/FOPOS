 <rect x="455" y="455" width="165" height="42" rx="5"/><rect x="455" y="515" width="165" height="42" rx="5"/><rect x="455" y="575" width="165" height="30" rx="5"/>
 <rect x="680" y="455" width="165" height="42" rx="5"/><rect x="680" y="515" width="165" height="42" rx="5"/><rect x="680" y="575" width="165" height="30" rx="5"/>
</g>
<g fill="#35483d" font-family="Georgia,serif" font-size="27" font-weight="bold" text-anchor="middle">
 <text x="535" y="485">□ → ○</text><text x="535" y="545">△ → □</text><text x="535" y="599">○ → Ⅱ</text>
 <text x="762" y="485">□ △ → △</text><text x="762" y="545">Ⅱ → ○</text><text x="762" y="599">○ → △</text>
