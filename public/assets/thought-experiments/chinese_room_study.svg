<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Searle'ün Çin Odası</title>
<desc id="desc">Sıcak ışıklı ahşap bir çalışma odasında sembol kartları, kural kitabı ve işlem tepsileri.</desc>
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#263a32"/><stop offset="1" stop-color="#526354"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#795338"/><stop offset="1" stop-color="#3e2b22"/></linearGradient>
 <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#986a42"/><stop offset="1" stop-color="#4b3023"/></linearGradient>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff4d9"/><stop offset="1" stop-color="#d9c69e"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#ffe7a8" stop-opacity=".7"/><stop offset="1" stop-color="#f4bf69" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#wall)"/>
