<path d="M0 520Q640 490 1280 520V720H0Z" fill="url(#desk)"/>
<path d="M0 538Q640 510 1280 538" fill="none" stroke="#c08a54" stroke-width="8" opacity=".7"/>
<path d="M0 685H1280" stroke="#2d201a" stroke-width="15" opacity=".5"/>
<!-- lamp stand -->
<path d="M130 535L144 250L340 118" fill="none" stroke="#272725" stroke-width="20" stroke-linecap="round"/>
