<rect x="900" y="0" width="380" height="420" fill="#3d2b23" stroke="#9a7048" stroke-width="14"/>
<rect x="928" y="20" width="324" height="365" fill="#d6c6a2"/>
<g stroke="#654832" stroke-width="10"><path d="M982 20v365M1037 20v365M1092 20v365M1147 20v365M1202 20v365M928 92h324M928 165h324M928 238h324M928 311h324"/></g>
<rect x="858" y="0" width="22" height="435" fill="#6e4b32"/>
