name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate product contracts
        run: |
          set -o pipefail
          npm run test:contracts 2>&1 | tee contract-tests.tap

      - name: Surface failing contract tests as annotations
        if: always()
        run: |
          if [ -f contract-tests.tap ]; then
            grep -E '^not ok' contract-tests.tap | head -50 | while IFS= read -r line; do
              printf '::error title=Sozlesme testi hatasi::%s\\n' "$line"
            done
          fi

      - name: Lint
        run: npm run lint

      - name: Build and validate hosting artifact
        run: npm run build

      - name: Publish CI evidence summary
        run: npm run ci:evidence-summary
        env:
          CONTRACT_TEST_LOG: contract-tests.tap
