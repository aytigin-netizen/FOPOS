name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate product contracts
        run: npm run test:contracts 2>&1 | tee contract-tests.tap

      - name: Lint
        run: npm run lint

      - name: Build and validate hosting artifact
        run: npm run build

      - name: Publish CI evidence summary
        run: npm run ci:evidence-summary
        env:
          CONTRACT_TEST_LOG: contract-tests.tap
