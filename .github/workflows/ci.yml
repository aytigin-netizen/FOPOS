name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate product contracts
        run: |
          set -o pipefail
          npm run test:contracts 2>&1 | tee contract-tests.tap

      - name: Diagnose failing philosophy annual plan test
        if: always()
        run: |
          node --experimental-strip-types --test tests/philosophy-curriculum-2026-annual-plan.test.mjs 2>&1 | head -120 | grep -E 'not ok|error|bulunamad|saati|çıktı|fail|Error|at ' | head -60 | while IFS= read -r line; do
            printf '::error title=Teşhis::%s\n' "$line"
          done

      - name: Lint
        run: npm run lint

      - name: Build and validate hosting artifact
        run: npm run build

      - name: Publish CI evidence summary
        run: npm run ci:evidence-summary
        env:
          CONTRACT_TEST_LOG: contract-tests.tap
