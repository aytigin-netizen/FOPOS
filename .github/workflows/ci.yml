name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate product contracts
        run: |
          set -o pipefail
          npm run test:contracts 2>&1 | tee contract-tests.tap

      - name: Publish test failure details (temporary diagnostics)
        if: failure()
        run: |
          grep -E "not ok|# fail|# tests|# pass|Error|error:|✖|AssertionError|SyntaxError" contract-tests.tap | head -40 | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's//%0D/g')
            echo "::error::${msg}"
          done

      - name: Lint
        run: npm run lint

      - name: Build and validate hosting artifact
        run: npm run build

      - name: Publish CI evidence summary
        run: npm run ci:evidence-summary
        env:
          CONTRACT_TEST_LOG: contract-tests.tap
