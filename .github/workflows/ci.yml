name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Validate curriculum data
        run: npm run curriculum:validate

      - name: Validate lesson studio integration
        run: npm run studio:validate

      - name: Validate daily plan integration
        run: npm run daily-plan:validate

      - name: Validate annual plan integration
        run: npm run annual-plan:validate

      - name: Validate department minutes integration
        run: npm run department-minutes:validate

      - name: Validate exam generator integration
        run: npm run exam-generator:validate

      - name: Validate exam analysis integration
        run: npm run exam-analysis:validate

      - name: Validate FOPOS AI
        run: npm run fopos-ai:validate

      - name: Validate privacy lifecycle
        run: npm run privacy:validate

      - name: Validate release readiness
        run: npm run release:validate

      - name: Validate document engine
        run: npm run document:validate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run teacher workflow tests
        run: npm run e2e

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
