name: Deploy Cloudflare Workers

# FOPOS'un canlı dağıtımı ChatGPT Plus'a bağlı olmayan kendi Cloudflare
# Workers hesabımızda yapılır. main'e push → build → deploy zinciri
# otomatiktir; elle "Deploy" düğmesine basmak da mümkündür.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Aynı anda iki dağıtım çakışmasın: yeni dağıtım eskisinin önüne geçmez,
# sıraya alınır.
concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Derleme süresi CI'da masaüstünden uzun olabilir.
      SITES_BUILD_TIMEOUT: 10m

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Secret panodan kopyalanırken başına/sonuna boşluk ya da tırnak
      # girebiliyor. Cloudflare bunu "400 / 9106 Authentication failed" olarak
      # bildiriyor ve deploy sessizce başarısız oluyor. Değerler burada
      # normalleştirilir.
      # Hesap kimliği sır değildir ve config/deploy-target.json içinde durur.
      # Tek gereken secret CLOUDFLARE_API_TOKEN'dır — iki alanı karıştırma
      # riski bu sayede ortadan kalkar.
      - name: Prepare and verify Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # ÖNEMLİ: tr'de karakter sınıfı çift parantezle yazılır ([[:space:]]).
          # Tek parantezli hâli boşlukları değil harfleri siler ve tab'ı
          # yerinde bırakır → curl "URL malformed" (çıkış 3).
          token="$(printf '%s' "${RAW_TOKEN}" | tr -d '[[:space:]]' | tr -d '"' | tr -d "'")"
          account="$(node -e "
            const t = require('./config/deploy-target.json');
            process.stdout.write(t.accountId);
          ")"
          echo "::add-mask::${token}"
          {
            echo "CLOUDFLARE_API_TOKEN=${token}"
            echo "CLOUDFLARE_ACCOUNT_ID=${account}"
          } >> "$GITHUB_ENV"
          export CLOUDFLARE_API_TOKEN="${token}"
          export CLOUDFLARE_ACCOUNT_ID="${account}"

          echo "Hesap kimliği: ${#account} karakter · token: ${#token} karakter"
          # Token özeti: kullanıcı değeri girmeden sonra "doğru mu?" diye
          # doğrulayabilmemiz için. Değer değil, geri döndürülemez özet loglanır.
          echo "Token özeti (sha256, ilk 16): $(printf '%s' "${token}" | sha256sum | cut -c1-16)"
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret'ı boş ya da yok. Depo ayarlarından eklenmeli."
            exit 1
          fi
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::config/deploy-target.json içindeki hesap kimliği 32 hexadecimal karakter olmalı."
            exit 1
          fi
          if [[ ! "${CLOUDFLARE_API_TOKEN}" =~ ^cfut_[A-Za-z0-9_-]{40,}$ ]]; then
            echo "::error::Token biçimi geçersiz (${#token} karakter). 'cfut_' ile başlayan Workers+D1 yetkili bir token olmalı."
            echo "::error::Secret panodaki değeri silip yeniden yapıştırırken başında/sonunda boşluk ya da tırnak olmadığından emin ol."
            exit 1
          fi

          code="$(curl -s -o /tmp/cf-check.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")" || {
            echo "::error::Cloudflare isteği başarısız (curl çıkış kodu $?). URL biçimsiz olabilir."
            exit 1
          }
          if [[ "${code}" != "200" ]]; then
            echo "::error::Cloudflare erişimi doğrulanamadı (HTTP ${code}). Token hatalı olabilir."
            head -c 400 /tmp/cf-check.json
            exit 1
          fi
          echo "✓ Cloudflare erişimi doğrulandı (HTTP 200)."

      - name: Install dependencies
        run: npm ci

      - name: Build Worker artifact
        run: npm run build:workers

      # pipefail olmadan hata `tee` tarafından yutulur ve adım yanlışlıkla
      # "başarılı" görünür. Bu hatayla canlıya eski sürüm çıkmış olur.
      - name: Deploy Worker
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy | tee deploy.log
          echo "version-id=$(grep -oE 'Current Version ID: .*' deploy.log | cut -d' ' -f4)" >> "$GITHUB_OUTPUT"

      # Deploy adımı yeşil olsa bile yeni sürümün gerçekten canlıda olduğunu
      # doğrular. Aksi hâlde "başarılı görünen ama etkisiz" dağıtım olur.
      - name: Confirm deployed version is live
        run: |
          set -euo pipefail
          expected="${{ steps.deploy.outputs.version-id }}"
          if [[ -z "${expected}" ]]; then
            echo "::error::Dağıtım sürüm kimliği okunamadı."
            exit 1
          fi
          live="$(curl -s \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/fopos-ders-studyosu/deployments" \
            | node -e "let raw='';process.stdin.on('data',d=>raw+=d).on('end',()=>{
                const list=(JSON.parse(raw).result?.deployments)||[];
                list.sort((a,b)=>String(b.created_on).localeCompare(String(a.created_on)));
                console.log(list[0]?.versions?.[0]?.version_id||'');
              })")"
          if [[ "${live}" != "${expected}" ]]; then
            echo "::error::Canlı sürüm dağıtılan sürümle eşleşmiyor. beklenen=${expected} canlı=${live}"
            exit 1
          fi
          echo "✓ Canlı sürüm doğrulandı: ${live}"

      - name: Verify live deployment
        run: |
          set -o pipefail
          node scripts/verify-live-deployment.mjs \
            $(node -e "process.stdout.write(require('./config/deploy-target.json').liveUrl)") | tee live-verification.log

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## FOPOS Workers deployment"
            echo
            echo "- Target: $(node -e "process.stdout.write(require('./config/deploy-target.json').liveUrl)")"
            echo "- Commit: ${{ github.sha }}"
            echo "- Worker version: ${{ steps.deploy.outputs.version-id }}"
            echo
            echo '~~~text'
            cat live-verification.log 2>/dev/null || echo "(doğrulama çıktısı yok)"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
